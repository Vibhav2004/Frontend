<div id="pwa-install-popup" class="pwa-hidden">
  <div class="pwa-card">
    <img src="/assests/logo-removebg-preview.png" alt="App Icon">
    <h3>Install SwipeNow</h3>
    <p> A full app experience right at your palm.</p>

    <div class="actions">
      <button id="installBtn">Install</button>
      <button id="closeBtn">Not now</button>
    </div>
  </div>
</div>
<script>
  function showInstallPopup() {
  document.getElementById("pwa-install-popup").classList.remove("pwa-hidden");
}

document.getElementById("installBtn")?.addEventListener("click", async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  const { outcome } = await deferredPrompt.userChoice;
  console.log("Install choice:", outcome);

  deferredPrompt = null;
  document.getElementById("pwa-install-popup").classList.add("pwa-hidden");
});

document.getElementById("closeBtn")?.addEventListener("click", () => {
  document.getElementById("pwa-install-popup").classList.add("pwa-hidden");
});
window.addEventListener("appinstalled", () => {
  console.log("PWA installed");
  document.getElementById("pwa-install-popup")?.remove();
});

</script>
<script>
// ============================
// PLATFORM DETECTION
// ============================
function isIOS() {
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
}

// ============================
// ANDROID INSTALL EVENT
// ============================
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {

  e.preventDefault();
  deferredPrompt = e;

  if (!isStandalone() && !localStorage.getItem("pwaInstalled")) {
    showInstallPopup();
  }

});

// ============================
// IOS INSTALL FLOW
// ============================
window.addEventListener("load", () => {

  if (isIOS() && !isStandalone() && !localStorage.getItem("pwaInstalled")) {

    setTimeout(() => {

      const popup = document.getElementById("pwa-install-popup");

      if (popup) popup.classList.remove("pwa-hidden");

      const installBtn = document.getElementById("installBtn");

      if (installBtn) {
        installBtn.onclick = () => {
          alert(
"Install SwipeNow\n\n1️⃣ Tap Share icon\n2️⃣ Tap 'Add to Home Screen'\n3️⃣ Tap Add"
          );
        };
      }

    }, 2500);
  }

});

// ============================
// AFTER INSTALL
// ============================
window.addEventListener("appinstalled", () => {
  localStorage.setItem("pwaInstalled", "true");
});
</script>
