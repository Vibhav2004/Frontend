  function installApp() {

document.getElementById("installBtn")?.addEventListener("click", async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  const { outcome } = await deferredPrompt.userChoice;
  console.log("Install choice:", outcome);

  deferredPrompt = null;
  document.getElementById("pwa-install-popup").classList.add("pwa-hidden");
});

document.getElementById("closeBtn")?.addEventListener("click", () => {
  document.getElementById("pwa-install-popup").classList.add("pwa-hidden");

<script>
  const btn = document.getElementById("dropdownBtn");
  const menu = document.getElementById("dropdownMenu");

  // Toggle dropdown
  btn.addEventListener("click", () => {
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  });

  // Image click handler
  menu.addEventListener("click", (e) => {
    if (e.target.tagName === "IMG") {
      const name = e.target.dataset.name;
      btn.textContent = name + " ↓";
      menu.style.display = "none";
    }
  });

  // Close on outside click
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".img-dropdown")) {
      menu.style.display = "none";
    }
  });
</script>

<script>
 document.addEventListener("DOMContentLoaded", () => {
  const username = localStorage.getItem("username");

  fetch(API.getProfile(username))

      return res.json();

      // console.log(data);
      updateUIs(data)
    } )
    .catch(err =>{ console.error(err)
      window.location.href="/pages/error.html"; });
});

function updateUIs(user) {
  // PROFILE INFO
  document.getElementById("email").textContent = `${user.email}`;
   document.getElementById("username").textContent = `@${user.username}`;
  

 
}
  
</script>
<script>
async function deleteAccount() {
    try {

        const email = document.querySelector(".email").innerText.trim();
        console.log(email);

  const response = await fetch(
      `https://backend2-kpkg.onrender.com/delete-account/${email}`,
      { method: "DELETE" }
    );

        if (!response.ok) {
            const text = await response.text();
            throw new Error(`Error ${response.status}: ${text}`);
        }

        const result = await response.text();
        console.log("Account deleted:", result);

        alert("Account deleted successfully!");
        window.location.replace("registeration.html");

    } catch (err) {

        console.error("Failed to delete account:", err);
        window.location.href="/pages/error.html"; 
        alert("Failed to delete account: " + err.message);

    }
}
// Example usage:

</script>




<script>
  const sendOtpAndRedirect = async (actionType) => {
  const email = document.querySelector(".email").innerText.trim();
  console.log("hello",email);
  
  try {
    const response = await fetch(API.sendOtp(email), {
      method: "POST",
    });

    if (!response.ok) {
      throw new Error("OTP send failed");
    }

    localStorage.setItem("otpEmail", email);
    localStorage.setItem("otpAction", actionType);

    window.location.href = "/pages/otp.html";

  } catch (error) {
    console.error(error);
    window.location.href="/pages/error.html"; 
    alert("Failed to send OTP");
  }
};

</script>
